name: TEMP Actions Secrets Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-actions-secrets-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      MEDIAFORGE_CORE_KEY_B64: ${{ secrets.MEDIAFORGE_CORE_KEY_B64 }}
      MEDIAFORGE_VOICE_REFERENCE_B64: ${{ secrets.MEDIAFORGE_VOICE_REFERENCE_B64 }}
      MEDIAFORGE_DATA_KEY_B64: ${{ secrets.MEDIAFORGE_DATA_KEY_B64 }}
      MEDIAFORGE_CORE_BUNDLE_B64: ${{ secrets.MEDIAFORGE_CORE_BUNDLE_B64 }}
    steps:
      - name: Verify required MediaForge secrets are present
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for name in \
            SUPABASE_SECRET_KEY SUPABASE_S3_ACCESS_KEY_ID SUPABASE_S3_SECRET_ACCESS_KEY \
            MEDIAFORGE_CORE_KEY_B64 MEDIAFORGE_VOICE_REFERENCE_B64 MEDIAFORGE_DATA_KEY_B64 MEDIAFORGE_CORE_BUNDLE_B64
          do
            if [ -n "${!name:-}" ]; then
              echo "$name=OK"
            else
              echo "$name=MISSING"
              failed=1
            fi
          done
          exit "$failed"
