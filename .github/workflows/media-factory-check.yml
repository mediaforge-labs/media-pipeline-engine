name: MediaForge Factory Static Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - public-worker-template/factory_worker_v2.py
      - public-worker-template/factory_worker_v3.py
      - public-worker-template/factory_worker_v3_resilient.py
      - public-worker-template/factory_worker_v4.py
      - public-worker-template/supabase_chunked.py
      - public-worker-template/dell_asset_client.py
      - public-worker-template/dell_asset_client_v5.py
      - public-worker-template/worker.py
      - public-worker-template/worker_v2.py
      - public-worker-template/validate_render.py
      - .github/workflows/media-factory.yml
      - .github/workflows/media-factory-check.yml

permissions:
  contents: read

concurrency:
  group: mediaforge-factory-static-check
  cancel-in-progress: true

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install media test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Compile complete factory pipeline
        run: |
          set -euo pipefail
          python --version
          ffmpeg -version | head -n 1
          python -m py_compile \
            public-worker-template/factory_worker_v2.py \
            public-worker-template/factory_worker_v3.py \
            public-worker-template/factory_worker_v3_resilient.py \
            public-worker-template/factory_worker_v4.py \
            public-worker-template/supabase_chunked.py \
            public-worker-template/dell_asset_client.py \
            public-worker-template/dell_asset_client_v5.py \
            public-worker-template/worker.py \
            public-worker-template/worker_v2.py \
            public-worker-template/validate_render.py

      - name: Verify canonical production invariants
        run: |
          set -euo pipefail
          grep -q 'factory_worker_v4.py' .github/workflows/media-factory.yml
          grep -q "MEDIAFORGE_TTS_STRICT_CHUNK_ORDER: '1'" .github/workflows/media-factory.yml
          grep -q "MEDIAFORGE_STRICT_UNIQUE_MEDIA: '1'" .github/workflows/media-factory.yml
          grep -q "MEDIAFORGE_ACTIVE_GTA_VI_BASELINE: '126'" .github/workflows/media-factory.yml
          ! grep -q 'tools/s3_probe.py' .github/workflows/media-factory.yml
          ! grep -q 'SUPABASE_S3_ACCESS_KEY_ID' .github/workflows/media-factory.yml
          grep -q 'upload_direct_file' public-worker-template/factory_worker_v3_resilient.py
          grep -q 'supabase_chunked.upload_file' public-worker-template/factory_worker_v3_resilient.py
          grep -q 'music_enabled.*False' public-worker-template/factory_worker_v3.py
          grep -q -- '--verify-only' public-worker-template/factory_worker_v3.py
          grep -q -- '--require-five-shorts' public-worker-template/factory_worker_v3.py
          grep -q 'pre_upload_transform(out)' public-worker-template/factory_worker_v3.py
          grep -q 'Production contract requires exactly 5 Shorts' public-worker-template/factory_worker_v3.py
          grep -q 'mediaforge-github-v10-strict-watermarked-shorts-v2' public-worker-template/factory_worker_v4.py
          grep -q 'apply_output_watermarks' public-worker-template/factory_worker_v4.py
          grep -q 'impl.pre_upload_transform = apply_output_watermarks' public-worker-template/factory_worker_v4.py
          grep -q 'leonidanos-logo.png' public-worker-template/factory_worker_v4.py
          grep -q "scope') != 'gta-vi-owner-curated-only'" public-worker-template/validate_render.py
          grep -q 'expected exactly 5 Shorts' public-worker-template/validate_render.py
          grep -q 'music_tracks != 0' public-worker-template/validate_render.py
          grep -q 'catalog_availability_preflight' public-worker-template/dell_asset_client_v5.py
          grep -q 'Range.*bytes=0-0' public-worker-template/dell_asset_client_v5.py
          grep -q 'ThreadPoolExecutor' public-worker-template/dell_asset_client_v5.py
          grep -q 'Live GTA VI asset inventory is insufficient before TTS/render' public-worker-template/dell_asset_client_v5.py
          grep -q 'active_gta_vi_catalog_filter' public-worker-template/dell_asset_client_v5.py
          grep -q -- '-mudo.mp4' public-worker-template/dell_asset_client_v5.py
          grep -q 'media/gta_vi' public-worker-template/dell_asset_client_v5.py

      - name: Validate transient retry classifier without importing production dependencies
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, pathlib
          p=pathlib.Path('public-worker-template/factory_worker_v2.py')
          tree=ast.parse(p.read_text())
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='is_transient_failure')
          ns={'re': __import__('re')}
          exec(compile(ast.Module(body=[fn],type_ignores=[]),str(p),'exec'),ns)
          f=ns['is_transient_failure']
          assert f("ConnectionResetError: connection reset by peer")
          assert f("HTTP 503 Service Unavailable")
          assert f("dell_asset_client_v5.py returned non-zero exit status 1")
          assert not f("Duplicate assets detected in semantic media map")
          assert not f("Factory job has no usable TTS script")
          print('retry_classifier_ok')
          PY

      - name: Prove active GTA VI edit filter excludes legacy stock
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, os, pathlib
          p=pathlib.Path('public-worker-template/dell_asset_client_v5.py')
          tree=ast.parse(p.read_text())
          wanted={'_normalise_path','_is_active_edit_asset'}
          nodes=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in wanted]
          ns={'pathlib':pathlib}
          exec(compile(ast.Module(body=nodes,type_ignores=[]),str(p),'exec'),ns)
          f=ns['_is_active_edit_asset']
          assert f({'file_name':'cut-mudo.mp4','relative_path':'media/gta_vi/cortes_por_atividade/carros/cut-mudo.mp4'})
          assert f({'file_name':'master-mudo.mp4','relative_path':'media/gta_vi/por_local/master-mudo.mp4'})
          assert not f({'file_name':'legacy.mp4','relative_path':'media/stock_videos/rockstar/legacy.mp4'})
          assert not f({'file_name':'frame.jpg','relative_path':'media/gta_vi/frame.jpg'})
          print('active_gta_vi_edit_filter_ok')
          PY

      - name: Prove semantic selection cannot shrink below live unique inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, pathlib
          p=pathlib.Path('public-worker-template/dell_asset_client_v5.py')
          tree=ast.parse(p.read_text())
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='choose_unique_pool_live')

          class Legacy:
              @staticmethod
              def segment_script(script):
                  return ['scene-a', 'scene-b', 'scene-c']

          state={'live': [{'asset_id':'a'}, {'asset_id':'b'}]}
          def active_catalog(assets):
              return list(assets)
          def live_catalog(assets):
              live=list(state['live'])
              stale=[str(x['asset_id']) for x in assets if x not in live]
              return live, stale
          calls=[]
          def chooser(title, script, assets, max_assets, byte_budget):
              calls.append(list(assets))
              return 'selected'

          ns={
              'legacy': Legacy(),
              '_active_edit_assets': active_catalog,
              '_live_catalog_assets': live_catalog,
              '_original_choose_unique_pool': chooser,
          }
          exec(compile(ast.Module(body=[fn], type_ignores=[]), str(p), 'exec'), ns)
          choose=ns['choose_unique_pool_live']
          catalog=[{'asset_id':'a'}, {'asset_id':'b'}, {'asset_id':'c'}, {'asset_id':'d'}]
          try:
              choose('title', 'one two three', catalog, 180, 10_000_000)
          except SystemExit as exc:
              text=str(exc)
              assert 'live=2' in text and 'required=3' in text and 'reuse remains disabled' in text
          else:
              raise AssertionError('selector silently accepted insufficient live inventory')

          state['live']=[{'asset_id':'a'}, {'asset_id':'b'}, {'asset_id':'c'}]
          assert choose('title', 'one two three', catalog, 180, 10_000_000) == 'selected'
          assert len(calls)==1 and len(calls[0])==3
          print('live_inventory_selection_gate_ok')
          PY

      - name: Exercise final media validator with real decodable fixtures
        run: |
          set -euo pipefail
          ROOT=.runtime/validator-fixture
          SEL=.runtime/validator-selection.json
          mkdir -p "$ROOT/video" "$ROOT/audio" "$ROOT/captions" "$ROOT/media" "$ROOT/shorts"

          ffmpeg -y -loglevel error \
            -f lavfi -i 'color=c=black:s=1280x720:r=10:d=61' \
            -f lavfi -i 'sine=frequency=440:sample_rate=24000:duration=61' \
            -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac \
            "$ROOT/video/long-form.mp4"
          ffmpeg -y -loglevel error \
            -f lavfi -i 'sine=frequency=440:sample_rate=24000:duration=61' \
            -c:a pcm_s16le "$ROOT/audio/narration.wav"

          for i in 1 2 3 4 5; do
            ffmpeg -y -loglevel error \
              -f lavfi -i "testsrc2=s=360x640:r=15:d=6" \
              -f lavfi -i "sine=frequency=$((440+i*20)):sample_rate=24000:duration=6" \
              -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac \
              "$ROOT/shorts/short-0${i}.mp4"
            test "$(stat -c%s "$ROOT/shorts/short-0${i}.mp4")" -ge 50000
          done

          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.runtime/validator-fixture')
          (root/'manifest.json').write_text(json.dumps({'metrics': {'video_assets': 5, 'music_tracks': 0, 'narration_seconds': 61}}))
          (root/'media/manifest.json').write_text(json.dumps({'version': 'compact-no-per-scene-source'}))
          (root/'captions/long-form.srt').write_text('1\n00:00:00,000 --> 00:00:01,000\nTeste\n')
          selection={
              'scope': 'gta-vi-owner-curated-only',
              'downloaded_unique_assets': 5,
              'required_unique_assets': 5,
              'reuse_allowed': False,
              'segments': [{'segment_index': i} for i in range(5)],
              'segment_asset_map': [{'segment_index': i, 'asset_id': f'asset-{i}'} for i in range(5)],
          }
          pathlib.Path('.runtime/validator-selection.json').write_text(json.dumps(selection))
          PY

          python public-worker-template/validate_render.py \
            --root "$ROOT" \
            --selection "$SEL" \
            --require-five-shorts | tee .runtime/validator-result.json
          grep -q '"status": "validated"' .runtime/validator-result.json
          grep -q '"media_verification_source": "selection_manifest"' .runtime/validator-result.json
          grep -q '"shorts": 5' .runtime/validator-result.json

      - name: Prove validator rejects reused media and a sixth Short
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='.runtime/validator-selection.json'
          data=json.load(open(p))
          data['segment_asset_map'][4]['asset_id']='asset-0'
          json.dump(data,open('.runtime/validator-selection-duplicate.json','w'))
          PY
          if python public-worker-template/validate_render.py \
            --root .runtime/validator-fixture \
            --selection .runtime/validator-selection-duplicate.json \
            --require-five-shorts; then
            echo 'Validator incorrectly accepted duplicate media' >&2
            exit 1
          fi
          cp .runtime/validator-fixture/shorts/short-01.mp4 .runtime/validator-fixture/shorts/short-06.mp4
          if python public-worker-template/validate_render.py \
            --root .runtime/validator-fixture \
            --selection .runtime/validator-selection.json \
            --require-five-shorts; then
            echo 'Validator incorrectly accepted six Shorts' >&2
            exit 1
          fi
          echo 'negative_validator_tests_ok'
