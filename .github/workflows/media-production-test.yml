name: Media Production Test

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Production lane to validate
        required: true
        type: choice
        default: pt-1
        options:
          - pt-1
          - en-1
      job_manifest:
        description: Production test manifest
        required: false
        default: jobs/voice-calibration.json

permissions:
  contents: read

jobs:
  production-test:
    name: ${{ inputs.lane }} / Chatterbox V3
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve locale
        run: |
          set -euo pipefail
          case "${{ inputs.lane }}" in
            pt-1) echo "MEDIAFORGE_LOCALE=pt-BR" >> "$GITHUB_ENV" ;;
            en-1) echo "MEDIAFORGE_LOCALE=en-US" >> "$GITHUB_ENV" ;;
            *) echo "Unsupported lane"; exit 1 ;;
          esac

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            public-worker-template/requirements.txt
            public-worker-template/requirements-production.txt

      - name: Cache Chatterbox models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-multilingual-v3-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r public-worker-template/requirements.txt
          pip install -r public-worker-template/requirements-production.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Materialize encrypted production core
        env:
          CORE_BUNDLE_B64: ${{ secrets.MEDIAFORGE_CORE_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "$CORE_BUNDLE_B64" || {
            echo "MEDIAFORGE_CORE_BUNDLE_B64 is not configured"
            exit 1
          }
          mkdir -p .runtime
          printf '%s' "$CORE_BUNDLE_B64" | base64 --decode > .runtime/core.bundle.enc
          test -s .runtime/core.bundle.enc
          echo "MEDIAFORGE_BUNDLE_PATH=$(realpath .runtime/core.bundle.enc)" >> "$GITHUB_ENV"

      - name: Materialize canonical human voice reference
        env:
          VOICE_REFERENCE_B64: ${{ secrets.MEDIAFORGE_VOICE_REFERENCE_B64 }}
        run: |
          set -euo pipefail
          test -n "$VOICE_REFERENCE_B64" || {
            echo "MEDIAFORGE_VOICE_REFERENCE_B64 is not configured"
            exit 1
          }
          printf '%s' "$VOICE_REFERENCE_B64" | base64 --decode > .runtime/voice-reference.ogg
          test -s .runtime/voice-reference.ogg
          ffmpeg -y -i .runtime/voice-reference.ogg \
            -vn -ac 1 -ar 24000 -c:a pcm_s16le .runtime/voice-reference.wav
          test -s .runtime/voice-reference.wav
          echo "MEDIAFORGE_VOICE_REFERENCE_PATH=$(realpath .runtime/voice-reference.wav)" >> "$GITHUB_ENV"

      - name: Validate production manifest
        run: |
          set -euo pipefail
          test -f "${{ inputs.job_manifest }}"
          python -m json.tool "${{ inputs.job_manifest }}" >/dev/null

      - name: Run human-voice production core
        env:
          MEDIAFORGE_CORE_KEY_B64: ${{ secrets.MEDIAFORGE_CORE_KEY_B64 }}
          MEDIAFORGE_TTS_PROVIDER: chatterbox
        run: |
          python public-worker-template/worker.py \
            --bundle "$MEDIAFORGE_BUNDLE_PATH" \
            --job "${{ inputs.job_manifest }}" \
            --lane "${{ inputs.lane }}" \
            --locale "$MEDIAFORGE_LOCALE" \
            --output-dir "out/${{ inputs.lane }}"

      - name: Validate real production output
        run: |
          set -euo pipefail
          test -s "out/${{ inputs.lane }}/manifest.json"
          test -s "out/${{ inputs.lane }}/audio/narration.wav"
          test -s "out/${{ inputs.lane }}/video/long-form.mp4"
          test -s "out/${{ inputs.lane }}/media/manifest.json"
          test "$(find "out/${{ inputs.lane }}/shorts" -name 'short-*.mp4' -type f -size +0c | wc -l)" -ge 5
          python - <<'PY'
          import json, os
          lane = os.environ['LANE']
          with open(f'out/{lane}/manifest.json', encoding='utf-8') as f:
              data = json.load(f)
          tts = data['pipeline']['tts']
          if tts['provider'] != 'chatterbox-multilingual-v3':
              raise SystemExit(f"Unexpected TTS provider: {tts['provider']}")
          if tts.get('pronunciation_profile') != 'pt-br-human-v3' and data['job']['locale'] == 'pt-BR':
              raise SystemExit('Old Portuguese pronunciation profile detected')
          if data['metrics']['media_assets'] < 1:
              raise SystemExit('No real media assets were rendered')
          print(json.dumps({'tts': tts, 'metrics': data['metrics']}, ensure_ascii=False))
          PY
        env:
          LANE: ${{ inputs.lane }}

      - name: Encrypt production result
        env:
          MEDIAFORGE_DATA_KEY_B64: ${{ secrets.MEDIAFORGE_DATA_KEY_B64 }}
        run: |
          python private-worker-core/public_finalize.py \
            --input-dir "out/${{ inputs.lane }}" \
            --output "artifacts/${{ inputs.lane }}.production.result.enc"

      - name: Upload encrypted production artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaforge-production-${{ inputs.lane }}-${{ github.run_id }}
          path: artifacts/${{ inputs.lane }}.production.result.enc
          if-no-files-found: error
          retention-days: 2
