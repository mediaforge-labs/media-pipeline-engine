name: MediaForge S3 Credentials Smoke

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/s3-credentials-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    name: Supabase S3 read-write-delete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned S3 client
        run: python -m pip install 'boto3==1.40.17'

      - name: Verify MediaForge Supabase S3
        env:
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          test -n "$SUPABASE_S3_ACCESS_KEY_ID" || { echo 'SUPABASE_S3_ACCESS_KEY_ID missing'; exit 1; }
          test -n "$SUPABASE_S3_SECRET_ACCESS_KEY" || { echo 'SUPABASE_S3_SECRET_ACCESS_KEY missing'; exit 1; }
          python tools/s3_probe.py
