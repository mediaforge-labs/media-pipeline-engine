name: MediaForge Dell Canary V2

on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: YouTube queue ID to render
        required: false
        default: 530e6f9a-7c9d-4cb8-b0a6-69e4ac8fc00c
  push:
    branches:
      - main
    paths:
      - automation/dell-canary-v2-request.json

permissions:
  contents: read

concurrency:
  group: mediaforge-dell-canary-v2
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            public-worker-template/requirements.txt
            public-worker-template/requirements-production.txt

      - name: Preflight public pipeline syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            public-worker-template/build_canary_job.py \
            public-worker-template/dell_asset_client.py \
            public-worker-template/dell_asset_client_v5.py \
            public-worker-template/worker.py \
            public-worker-template/worker_v2.py \
            public-worker-template/validate_render.py

      - name: Cache Chatterbox models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-multilingual-v3-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Install production dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          pip install -r public-worker-template/requirements.txt
          pip install -r public-worker-template/requirements-production.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Materialize encrypted production core v7
        run: |
          set -euo pipefail
          mkdir -p .runtime
          cat encrypted-core/v7/part-01a.b64 encrypted-core/v7/part-01b.b64 encrypted-core/v7/part-02.b64 encrypted-core/v7/part-03.b64 encrypted-core/v7/part-04.b64 \
            | tr -d '\r\n\t ' | base64 --decode > .runtime/core.bundle.enc
          test "$(stat -c%s .runtime/core.bundle.enc)" -eq 21279
          echo "MEDIAFORGE_BUNDLE_PATH=$(realpath .runtime/core.bundle.enc)" >> "$GITHUB_ENV"

      - name: Materialize approved human voice
        env:
          VOICE_REFERENCE_B64: ${{ secrets.MEDIAFORGE_VOICE_REFERENCE_B64 }}
        run: |
          set -euo pipefail
          test -n "$VOICE_REFERENCE_B64"
          printf '%s' "$VOICE_REFERENCE_B64" | base64 --decode > .runtime/voice-reference.ogg
          ffmpeg -y -loglevel error -i .runtime/voice-reference.ogg -vn -ac 1 -ar 24000 -c:a pcm_s16le .runtime/voice-reference.wav
          test -s .runtime/voice-reference.wav
          echo "MEDIAFORGE_VOICE_REFERENCE_PATH=$(realpath .runtime/voice-reference.wav)" >> "$GITHUB_ENV"

      - name: Resolve canary queue
        env:
          MANUAL_QUEUE_ID: ${{ github.event.inputs.queue_id }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          q=(os.environ.get('MANUAL_QUEUE_ID') or '').strip()
          p=pathlib.Path('automation/dell-canary-v2-request.json')
          if not q and p.exists(): q=str(json.loads(p.read_text()).get('queue_id') or '').strip()
          if not q: q='530e6f9a-7c9d-4cb8-b0a6-69e4ac8fc00c'
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f'CANARY_QUEUE_ID={q}\n')
          print('queue_id=', q)
          PY

      - name: Build canary job
        env:
          SUPABASE_URL: https://rhddgfvtrkmusbvphnlg.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python public-worker-template/build_canary_job.py \
            --queue-id "$CANARY_QUEUE_ID" \
            --output .runtime/dell-canary-job.json \
            --script-out .runtime/dell-canary-script.txt

      - name: Select and fetch unique GTA VI assets
        env:
          SUPABASE_URL: https://rhddgfvtrkmusbvphnlg.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          TITLE="$(python -c "import json;print(json.load(open('.runtime/dell-canary-job.json'))['jobs']['pt-1']['title'])")"
          python public-worker-template/dell_asset_client_v5.py \
            --title "$TITLE" \
            --script-file .runtime/dell-canary-script.txt \
            --dest .runtime/dell-assets \
            --max-assets 140 \
            --max-total-bytes 8589934592 \
            --job-key "dell-canary-v2-${GITHUB_RUN_ID}"
          echo "MEDIAFORGE_VIDEO_LIBRARY_ROOT=$(realpath .runtime/dell-assets)" >> "$GITHUB_ENV"

      - name: Validate media pool before expensive TTS
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('.runtime/dell-assets')
          s=json.loads((root/'mediaforge-selection.json').read_text())
          c=json.loads((root/'Catalogo geral.json').read_text())
          selected=int(s.get('downloaded_unique_assets') or s.get('selected_unique_assets') or 0)
          required=int(s.get('required_unique_assets') or 0)
          rows=[x for x in s.get('segment_asset_map',[]) if x.get('segment_index') is not None]
          ids=[str(x.get('asset_id')) for x in rows if x.get('asset_id')]
          if s.get('reuse_allowed') is not False: raise SystemExit('reuse_allowed must be false')
          if selected < required or required < 1: raise SystemExit(f'insufficient unique media {selected}/{required}')
          if len(ids) != len(set(ids)): raise SystemExit('duplicate asset IDs in semantic map')
          if s.get('segments') and len(ids) != len(s['segments']): raise SystemExit('incomplete semantic map')
          files=[root/a['local_name'] for a in c.get('assets',[])]
          if len(files)!=selected: raise SystemExit('catalog count mismatch')
          for f in files:
              if not f.is_file() or f.stat().st_size<=0: raise SystemExit(f'invalid file: {f}')
              subprocess.run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=codec_name,width,height','-of','json',str(f)],check=True,stdout=subprocess.DEVNULL)
          print(json.dumps({'status':'media_preflight_ok','selected':selected,'required':required,'mapped':len(ids),'stale':len(s.get('unavailable_catalog_assets') or []),'ffprobe':len(files)}))
          PY

      - name: Verify encrypted core before expensive TTS
        env:
          MEDIAFORGE_CORE_KEY_B64: ${{ secrets.MEDIAFORGE_CORE_KEY_B64 }}
          MEDIAFORGE_TTS_STRICT_CHUNK_ORDER: '1'
          MEDIAFORGE_STRICT_UNIQUE_MEDIA: '1'
        run: |
          set -euo pipefail
          python public-worker-template/worker_v2.py \
            --bundle "$MEDIAFORGE_BUNDLE_PATH" \
            --job .runtime/dell-canary-job.json \
            --lane pt-1 --locale pt-BR --output-dir out/dell-canary --verify-only

      - name: Render long-form and Shorts
        id: render
        env:
          MEDIAFORGE_CORE_KEY_B64: ${{ secrets.MEDIAFORGE_CORE_KEY_B64 }}
          MEDIAFORGE_TTS_PROVIDER: chatterbox
          MEDIAFORGE_TTS_MAX_WORKERS: '1'
          MEDIAFORGE_TTS_STRICT_CHUNK_ORDER: '1'
          MEDIAFORGE_STRICT_UNIQUE_MEDIA: '1'
          MEDIAFORGE_DEBUG_SUBPROCESS_STDERR: '1'
          SUPABASE_URL: https://rhddgfvtrkmusbvphnlg.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python public-worker-template/worker_v2.py \
            --bundle "$MEDIAFORGE_BUNDLE_PATH" \
            --job .runtime/dell-canary-job.json \
            --lane pt-1 --locale pt-BR --output-dir out/dell-canary

      - name: Validate complete canary
        run: |
          set -euo pipefail
          python public-worker-template/validate_render.py \
            --root out/dell-canary \
            --selection .runtime/dell-assets/mediaforge-selection.json \
            --require-five-shorts

      - name: Upload canary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaforge-dell-canary-v2-${{ github.run_id }}
          path: |
            out/dell-canary/video/long-form.mp4
            out/dell-canary/shorts/*.mp4
            out/dell-canary/audio/narration.wav
            out/dell-canary/captions/long-form.srt
            out/dell-canary/media/manifest.json
            out/dell-canary/manifest.json
            .runtime/dell-assets/mediaforge-selection.json
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Delete temporary Dell copies
        if: always()
        run: rm -rf .runtime/dell-assets
