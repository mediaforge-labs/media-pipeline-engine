name: Apply Canary Checkpoint Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-canary-checkpoint-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move artifact upload before final validation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/media-dell-canary.yml')
          s = p.read_text()
          validate = '''      - name: Validate complete canary and forbid reused source video\n        run: |\n          set -euo pipefail\n          python public-worker-template/validate_render.py \\\n            --root out/dell-canary \\\n            --selection .runtime/dell-assets/mediaforge-selection.json \\\n            --require-five-shorts\n\n'''
          upload = '''      - name: Upload complete canary artifact\n        uses: actions/upload-artifact@v4\n        with:\n          name: mediaforge-dell-canary-${{ github.run_id }}\n          path: |\n            out/dell-canary/video/long-form.mp4\n            out/dell-canary/shorts/*.mp4\n            out/dell-canary/audio/narration.wav\n            out/dell-canary/audio/music-plan.json\n            out/dell-canary/captions/long-form.srt\n            out/dell-canary/media/manifest.json\n            out/dell-canary/manifest.json\n            .runtime/dell-assets/mediaforge-selection.json\n          compression-level: 0\n          retention-days: 2\n          if-no-files-found: error\n\n'''
          if validate not in s or upload not in s:
              raise SystemExit('expected validator/upload blocks not found')
          if s.index(upload) < s.index(validate):
              print('already fixed')
          else:
              s = s.replace(validate + upload, upload + validate, 1)
              p.write_text(s)
              print('moved artifact upload before final validation')
          PY
          git diff --check
          grep -n -E 'Upload complete canary artifact|Validate complete canary' .github/workflows/media-dell-canary.yml
      - name: Commit fix
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name mediaforge-labs
          git config user.email leonidanosportal@gmail.com
          git add .github/workflows/media-dell-canary.yml
          git commit -m 'Preserve Canary render before final validation'
          git push origin HEAD:main
