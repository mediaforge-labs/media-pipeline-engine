name: Apply Canary Checkpoint Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-canary-checkpoint-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move artifact upload before final validation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/media-dell-canary.yml')
          s = p.read_text()
          validate_marker = '      - name: Validate complete canary and forbid reused source video\n'
          upload_marker = '      - name: Upload complete canary artifact\n'
          delete_marker = '      - name: Delete temporary Dell copies from runner\n'
          vi = s.index(validate_marker)
          ui = s.index(upload_marker)
          di = s.index(delete_marker)
          if ui < vi:
              print('already fixed')
          else:
              validate_block = s[vi:ui]
              upload_block = s[ui:di]
              s = s[:vi] + upload_block + validate_block + s[di:]
              p.write_text(s)
              print('moved artifact upload before final validation')
          PY
          git diff --check
          grep -n -E 'Upload complete canary artifact|Validate complete canary' .github/workflows/media-dell-canary.yml
      - name: Commit fix
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name mediaforge-labs
          git config user.email leonidanosportal@gmail.com
          git add .github/workflows/media-dell-canary.yml
          git commit -m 'Preserve Canary render before final validation'
          git push origin HEAD:main
