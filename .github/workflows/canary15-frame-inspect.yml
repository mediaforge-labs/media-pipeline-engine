name: Canary 15 Frame Inspect

on:
  push:
    paths:
      - 'automation/canary15-frame-inspect-trigger.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mediaforge-dell-canary-35553959281
          path: canary15
          repository: mediaforge-labs/media-pipeline-engine
          run-id: '35553959281'
          github-token: ${{ github.token }}
      - name: Extract frames
        run: |
          set -e
          VIDEO=canary15/video/long-form.mp4
          test -s "$VIDEO"
          mkdir inspect
          ffmpeg -y -loglevel error -ss 60 -i "$VIDEO" -frames:v 1 inspect/frame-60s.jpg
          ffmpeg -y -loglevel error -ss 180 -i "$VIDEO" -frames:v 1 inspect/frame-180s.jpg
          ffmpeg -y -loglevel error -ss 300 -i "$VIDEO" -frames:v 1 inspect/frame-300s.jpg || true
          cp canary15/manifest.json inspect/manifest.json
          cp canary15/media/manifest.json inspect/media-manifest.json
          find canary15/shorts -type f -name '*.mp4' -printf '%f\n' | sort > inspect/shorts.txt
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: canary15-frame-inspection
          path: inspect
          retention-days: 2
