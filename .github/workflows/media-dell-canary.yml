name: MediaForge Dell Canary

on:
  workflow_dispatch:
    inputs:
      queue_id:
        description: YouTube queue ID to render
        required: false
        default: 530e6f9a-7c9d-4cb8-b0a6-69e4ac8fc00c
  push:
    paths:
      - automation/dell-canary-request.json

permissions:
  contents: read

jobs:
  canary:
    name: PT-BR / Dell on-demand canary
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            public-worker-template/requirements.txt
            public-worker-template/requirements-production.txt

      - name: Preflight public pipeline syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            public-worker-template/build_canary_job.py \
            public-worker-template/dell_asset_client.py \
            public-worker-template/worker.py \
            public-worker-template/validate_render.py

      - name: Cache Chatterbox models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-multilingual-v3-${{ runner.os }}-${{ runner.arch }}-v3

      - name: Install production dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          pip install -r public-worker-template/requirements.txt
          pip install -r public-worker-template/requirements-production.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Materialize encrypted production core v7
        run: |
          set -euo pipefail
          mkdir -p .runtime
          cat \
            encrypted-core/v7/part-01a.b64 \
            encrypted-core/v7/part-01b.b64 \
            encrypted-core/v7/part-02.b64 \
            encrypted-core/v7/part-03.b64 \
            encrypted-core/v7/part-04.b64 \
            | tr -d '\r\n\t ' | base64 --decode > .runtime/core.bundle.enc
          test "$(stat -c%s .runtime/core.bundle.enc)" -eq 21279
          echo "MEDIAFORGE_BUNDLE_PATH=$(realpath .runtime/core.bundle.enc)" >> "$GITHUB_ENV"

      - name: Materialize approved human voice
        env:
          VOICE_REFERENCE_B64: ${{ secrets.MEDIAFORGE_VOICE_REFERENCE_B64 }}
        run: |
          set -euo pipefail
          test -n "$VOICE_REFERENCE_B64"
          printf '%s' "$VOICE_REFERENCE_B64" | base64 --decode > .runtime/voice-reference.ogg
          ffmpeg -y -loglevel error -i .runtime/voice-reference.ogg -vn -ac 1 -ar 24000 -c:a pcm_s16le .runtime/voice-reference.wav
          echo "MEDIAFORGE_VOICE_REFERENCE_PATH=$(realpath .runtime/voice-reference.wav)" >> "$GITHUB_ENV"

      - name: Resolve canary queue
        env:
          MANUAL_QUEUE_ID: ${{ github.event.inputs.queue_id }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          q=(os.environ.get('MANUAL_QUEUE_ID') or '').strip()
          p=pathlib.Path('automation/dell-canary-request.json')
          if not q and p.exists():
              q=str(json.loads(p.read_text(encoding='utf-8')).get('queue_id') or '').strip()
          if not q:
              q='530e6f9a-7c9d-4cb8-b0a6-69e4ac8fc00c'
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'CANARY_QUEUE_ID={q}\n')
          print('queue_id=',q)
          PY

      - name: Build canary job from Supabase queue
        env:
          SUPABASE_URL: https://rhddgfvtrkmusbvphnlg.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python public-worker-template/build_canary_job.py \
            --queue-id "$CANARY_QUEUE_ID" \
            --output .runtime/dell-canary-job.json \
            --script-out .runtime/dell-canary-script.txt

      - name: Select and fetch unique GTA VI assets
        env:
          SUPABASE_URL: https://rhddgfvtrkmusbvphnlg.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY"
          TITLE="$(python -c "import json;print(json.load(open('.runtime/dell-canary-job.json'))['jobs']['pt-1']['title'])")"
          python public-worker-template/dell_asset_client.py \
            --title "$TITLE" \
            --script-file .runtime/dell-canary-script.txt \
            --dest .runtime/dell-assets \
            --max-assets 140 \
            --max-total-bytes 8589934592 \
            --job-key "dell-canary-${GITHUB_RUN_ID}"
          echo "MEDIAFORGE_VIDEO_LIBRARY_ROOT=$(realpath .runtime/dell-assets)" >> "$GITHUB_ENV"

      - name: Validate media pool before expensive TTS
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('.runtime/dell-assets/mediaforge-selection.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          selected=int(data.get('selected_unique_assets') or 0)
          required=int(data.get('required_unique_assets') or 0)
          ids=[str(x.get('asset_id')) for x in data.get('segment_asset_map',[]) if x.get('asset_id')]
          if data.get('reuse_allowed') is not False:
              raise SystemExit('media pool does not forbid reuse')
          if selected < required or required < 1:
              raise SystemExit(f'insufficient unique media: selected={selected}, required={required}')
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate assets detected in semantic media map')
          print(json.dumps({'status':'media_preflight_ok','selected_unique':selected,'required_unique':required,'mapped_segments':len(ids),'scope':data.get('scope')},ensure_ascii=False))
          PY

      - name: Render long-form and Shorts
        env:
          MEDIAFORGE_CORE_KEY_B64: ${{ secrets.MEDIAFORGE_CORE_KEY_B64 }}
          MEDIAFORGE_TTS_PROVIDER: chatterbox
          MEDIAFORGE_TTS_MAX_WORKERS: '1'
          MEDIAFORGE_TTS_STRICT_CHUNK_ORDER: '1'
          MEDIAFORGE_STRICT_UNIQUE_MEDIA: '1'
          MEDIAFORGE_DEBUG_SUBPROCESS_STDERR: '1'
          SUPABASE_URL: https://rhddgfvtrkmusbvphnlg.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python public-worker-template/worker.py \
            --bundle "$MEDIAFORGE_BUNDLE_PATH" \
            --job .runtime/dell-canary-job.json \
            --lane pt-1 \
            --locale pt-BR \
            --output-dir out/dell-canary

      - name: Diagnose audio stage on render failure
        if: failure()
        run: |
          set +e
          AUDIO_DIR="out/dell-canary/audio"
          echo "MediaForge audio diagnostics after render failure"
          ls -lah "$AUDIO_DIR" || true
          if [ -f "$AUDIO_DIR/music-plan.json" ]; then
            echo "::group::music-plan.json"
            cat "$AUDIO_DIR/music-plan.json"
            echo
            echo "::endgroup::"
          fi
          for f in "$AUDIO_DIR"/*.wav; do
            [ -f "$f" ] || continue
            echo "::group::ffprobe $f"
            ffprobe -hide_banner -v error -show_streams -show_format "$f" || true
            echo "::endgroup::"
          done

      - name: Validate complete canary and forbid reused source video
        run: |
          set -euo pipefail
          python public-worker-template/validate_render.py \
            --root out/dell-canary \
            --selection .runtime/dell-assets/mediaforge-selection.json \
            --require-five-shorts

      - name: Upload complete canary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaforge-dell-canary-${{ github.run_id }}
          path: |
            out/dell-canary/video/long-form.mp4
            out/dell-canary/shorts/*.mp4
            out/dell-canary/audio/narration.wav
            out/dell-canary/audio/music-plan.json
            out/dell-canary/captions/long-form.srt
            out/dell-canary/media/manifest.json
            out/dell-canary/manifest.json
            .runtime/dell-assets/mediaforge-selection.json
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Delete temporary Dell copies from runner
        if: always()
        run: |
          rm -rf .runtime/dell-assets
          echo 'Temporary Dell assets removed from GitHub runner.'
