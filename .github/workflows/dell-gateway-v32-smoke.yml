name: Dell Gateway v3.2 Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/dell_asset_gateway_v32.py
      - tools/run_dell_asset_gateway_v32.ps1
      - tools/setup_dell_asset_gateway_v32.ps1
      - public-worker-template/dell_asset_client_v7.py
      - public-worker-template/factory_worker_v5.py
      - .github/workflows/dell-gateway-v32-smoke.yml

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        shell: pwsh
        run: |
          python -m py_compile tools/dell_asset_gateway_v32.py public-worker-template/dell_asset_client_v7.py public-worker-template/factory_worker_v5.py
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'tools/run_dell_asset_gateway_v32.ps1',
            'tools/setup_dell_asset_gateway_v32.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
          Write-Host 'Python and PowerShell syntax validation passed.'
      - name: Validate Dell transport retry classifier
        shell: pwsh
        run: |
          @'
          import ast
          import pathlib
          import re

          path = pathlib.Path('public-worker-template/factory_worker_v5.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          fn = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == '_is_transient_failure_v7')
          namespace = {
              're': re,
              '_original_transient_failure': lambda error: False,
          }
          exec(compile(ast.Module(body=[fn], type_ignores=[]), str(path), 'exec'), namespace)
          classify = namespace['_is_transient_failure_v7']

          assert classify("dell_asset_client_v7.py returned non-zero exit status 1")
          assert classify("Dell public gateway health check failed: NameResolutionError")
          assert classify("Dell asset gateway did not become healthy after automatic endpoint recovery")
          assert not classify("Duplicate assets detected in semantic media map")
          assert not classify("Factory job has no usable TTS script")
          print('dell_transport_retry_classifier_ok')
          '@ | python -
