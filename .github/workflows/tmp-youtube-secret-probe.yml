name: TEMP - YouTube Secret Presence Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-youtube-secret-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check YouTube secret presence only
        shell: bash
        env:
          YOUTUBE_PT_CLIENT_ID: ${{ secrets.YOUTUBE_PT_CLIENT_ID }}
          YOUTUBE_PT_CLIENT_SECRET: ${{ secrets.YOUTUBE_PT_CLIENT_SECRET }}
          YOUTUBE_PT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_PT_REFRESH_TOKEN }}
          YOUTUBE_PT_CHANNEL_ID: ${{ secrets.YOUTUBE_PT_CHANNEL_ID }}
          YOUTUBE_EN_CLIENT_ID: ${{ secrets.YOUTUBE_EN_CLIENT_ID }}
          YOUTUBE_EN_CLIENT_SECRET: ${{ secrets.YOUTUBE_EN_CLIENT_SECRET }}
          YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
          YOUTUBE_EN_CHANNEL_ID: ${{ secrets.YOUTUBE_EN_CHANNEL_ID }}
        run: |
          set -euo pipefail
          for name in \
            YOUTUBE_PT_CLIENT_ID YOUTUBE_PT_CLIENT_SECRET YOUTUBE_PT_REFRESH_TOKEN YOUTUBE_PT_CHANNEL_ID \
            YOUTUBE_EN_CLIENT_ID YOUTUBE_EN_CLIENT_SECRET YOUTUBE_EN_REFRESH_TOKEN YOUTUBE_EN_CHANNEL_ID; do
            if [ -n "${!name:-}" ]; then
              echo "$name=PRESENT"
            else
              echo "$name=ABSENT"
            fi
          done
