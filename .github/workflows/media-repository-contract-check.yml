name: MediaForge Active Repository Contract Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - public-worker-template/dell_asset_client_v6.py
      - public-worker-template/factory_worker_v5.py
      - .github/workflows/**
      - docs/CANONICAL_ARCHITECTURE.md

permissions:
  contents: read

concurrency:
  group: mediaforge-active-repository-contract-check
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile production entrypoints
        run: |
          set -euo pipefail
          python -m py_compile \
            public-worker-template/dell_asset_client_v6.py \
            public-worker-template/dell_asset_client_v5.py \
            public-worker-template/factory_worker_v5.py \
            public-worker-template/factory_worker_v4.py \
            public-worker-template/factory_worker_v3.py

      - name: Enforce GitHub-only production architecture
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          factory = Path('.github/workflows/media-factory.yml').read_text(encoding='utf-8')
          assert 'runs-on: ubuntu-latest' in factory
          assert 'self-hosted' not in factory
          assert 'Windows, X64' not in factory
          assert 'factory_worker_v5.py' in factory
          assert 'preferred_backend=eq.github' in factory

          worker = Path('public-worker-template/factory_worker_v5.py').read_text(encoding='utf-8')
          assert 'dell_asset_client_v6.py' in worker

          client = Path('public-worker-template/dell_asset_client_v6.py').read_text(encoding='utf-8')
          assert '3.2-active-gta-vi-rest' in client
          assert 'media/gta_vi-active-edit-only' in client
          assert 'media/gta_vi' in client
          assert '-mudo.mp4' in client

          disabled = [
              '.github/workflows/media-pipeline.yml',
              '.github/workflows/media-postprocess-music.yml',
              '.github/workflows/media-production-test.yml',
              '.github/workflows/media-dell-canary.yml',
              '.github/workflows/media-dell-canary-v2.yml',
              '.github/workflows/media-dell-canary-resume.yml',
              '.github/workflows/media-dell-integration-smoke.yml',
              '.github/workflows/media-calibration-trigger.yml',
              '.github/workflows/canary15-frame-inspect.yml',
              '.github/workflows/canary15-promote-approved.yml',
              '.github/workflows/canary15-watermark-repair.yml',
              '.github/workflows/tmp-leonidanos-factory-e2e-render.yml',
          ]
          for filename in disabled:
              text = Path(filename).read_text(encoding='utf-8')
              assert 'DISABLED' in text, f'Legacy production path re-enabled: {filename}'

          print('mediaforge_architecture_lock_ok: github_factory_only; dell_supplier_only')
          PY

      - name: Prove repository path normalization
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, pathlib
          p=pathlib.Path('public-worker-template/dell_asset_client_v6.py')
          tree=ast.parse(p.read_text())
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='normalise')
          ns={}
          exec(compile(ast.Module(body=[fn],type_ignores=[]),str(p),'exec'),ns)
          normalize=ns['normalise']
          assert normalize(r'C:\LeonidanosVideoPipeline\media\gta_vi\x') == 'c:/leonidanosvideopipeline/media/gta_vi/x'
          assert normalize('media/gta_vi/cortes_por_atividade/a-mudo.mp4') == 'media/gta_vi/cortes_por_atividade/a-mudo.mp4'
          print('repository_path_normalisation_ok')
          PY

      - name: Verify authoritative Dell gateway catalog builder contract
        run: |
          set -euo pipefail
          grep -q "ACTIVE_EDIT_SUFFIX='-mudo.mp4'" tools/dell_asset_gateway.py
          grep -q "ACTIVE_RELATIVE_ROOT=pathlib.PurePosixPath('media/gta_vi')" tools/dell_asset_gateway.py
          grep -q "scope':'media/gta_vi-active-edit-only'" tools/dell_asset_gateway.py
          grep -q "visual_duplicate_count" tools/dell_asset_gateway.py
          grep -q "quick_hash" tools/dell_asset_gateway.py
          grep -q "Catalogo pronto:" tools/setup_dell_asset_gateway.ps1
