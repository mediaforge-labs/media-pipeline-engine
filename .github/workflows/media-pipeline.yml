name: Media Pipeline

on:
  workflow_dispatch:
    inputs:
      bundle_path:
        description: Encrypted proprietary core bundle path
        required: false
        default: private-worker-core/core.bundle.enc

permissions:
  contents: read

jobs:
  render:
    name: ${{ matrix.lane }} / ${{ matrix.locale }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane: pt-1
            locale: pt-BR
          - lane: pt-2
            locale: pt-BR
          - lane: en-1
            locale: en-US
          - lane: en-2
            locale: en-US

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: public-worker-template/requirements.txt

      - name: Install worker dependencies
        run: pip install -r public-worker-template/requirements.txt

      - name: Validate encrypted core bundle
        env:
          BUNDLE_PATH: ${{ inputs.bundle_path }}
        run: |
          test -f "$BUNDLE_PATH" || {
            echo "Encrypted core bundle not found: $BUNDLE_PATH"
            exit 1
          }

      - name: Run worker
        env:
          MEDIAFORGE_CORE_KEY_B64: ${{ secrets.MEDIAFORGE_CORE_KEY_B64 }}
        run: |
          python public-worker-template/worker.py \
            --bundle "${{ inputs.bundle_path }}" \
            --lane "${{ matrix.lane }}" \
            --locale "${{ matrix.locale }}" \
            --output-dir "out/${{ matrix.lane }}"

      - name: Encrypt worker result
        env:
          MEDIAFORGE_DATA_KEY_B64: ${{ secrets.MEDIAFORGE_DATA_KEY_B64 }}
        run: |
          python private-worker-core/public_finalize.py \
            --input-dir "out/${{ matrix.lane }}" \
            --output "artifacts/${{ matrix.lane }}.result.enc"

      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: mediaforge-${{ matrix.lane }}-${{ github.run_id }}
          path: artifacts/${{ matrix.lane }}.result.enc
          if-no-files-found: error
          retention-days: 2
