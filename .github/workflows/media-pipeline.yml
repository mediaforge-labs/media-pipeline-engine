name: Media Pipeline

on:
  workflow_dispatch:
    inputs:
      bundle_path:
        description: Optional encrypted core bundle path committed to the repository
        required: false
        default: private-worker-core/core.bundle.enc
      job_manifest:
        description: Batch job manifest path
        required: false
        default: jobs/smoke-batch.json

permissions:
  contents: read

jobs:
  render:
    name: ${{ matrix.lane }} / ${{ matrix.locale }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - lane: pt-1
            locale: pt-BR
          - lane: pt-2
            locale: pt-BR
          - lane: en-1
            locale: en-US
          - lane: en-2
            locale: en-US

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: public-worker-template/requirements.txt

      - name: Install runtime dependencies
        run: |
          pip install -r public-worker-template/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Materialize encrypted core bundle
        env:
          REQUESTED_BUNDLE_PATH: ${{ inputs.bundle_path }}
          CORE_BUNDLE_B64: ${{ secrets.MEDIAFORGE_CORE_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -f "$REQUESTED_BUNDLE_PATH" ]; then
            BUNDLE_PATH="$(realpath "$REQUESTED_BUNDLE_PATH")"
          elif [ -n "$CORE_BUNDLE_B64" ]; then
            mkdir -p .runtime
            printf '%s' "$CORE_BUNDLE_B64" | base64 --decode > .runtime/core.bundle.enc
            BUNDLE_PATH="$(realpath .runtime/core.bundle.enc)"
          else
            echo "No encrypted core bundle is available."
            echo "Commit an encrypted bundle or configure MEDIAFORGE_CORE_BUNDLE_B64."
            exit 1
          fi
          test -s "$BUNDLE_PATH"
          echo "MEDIAFORGE_BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - name: Validate job manifest
        env:
          JOB_MANIFEST: ${{ inputs.job_manifest }}
        run: |
          set -euo pipefail
          test -f "$JOB_MANIFEST" || {
            echo "Job manifest not found: $JOB_MANIFEST"
            exit 1
          }
          python -m json.tool "$JOB_MANIFEST" >/dev/null

      - name: Run encrypted MediaForge core
        env:
          MEDIAFORGE_CORE_KEY_B64: ${{ secrets.MEDIAFORGE_CORE_KEY_B64 }}
        run: |
          python public-worker-template/worker.py \
            --bundle "$MEDIAFORGE_BUNDLE_PATH" \
            --job "${{ inputs.job_manifest }}" \
            --lane "${{ matrix.lane }}" \
            --locale "${{ matrix.locale }}" \
            --output-dir "out/${{ matrix.lane }}"

      - name: Validate generated media
        run: |
          test -s "out/${{ matrix.lane }}/manifest.json"
          test -s "out/${{ matrix.lane }}/video/long-form.mp4"
          test "$(find "out/${{ matrix.lane }}/shorts" -name 'short-*.mp4' -type f -size +0c | wc -l)" -ge 5

      - name: Encrypt worker result
        env:
          MEDIAFORGE_DATA_KEY_B64: ${{ secrets.MEDIAFORGE_DATA_KEY_B64 }}
        run: |
          python private-worker-core/public_finalize.py \
            --input-dir "out/${{ matrix.lane }}" \
            --output "artifacts/${{ matrix.lane }}.result.enc"

      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: mediaforge-${{ matrix.lane }}-${{ github.run_id }}
          path: artifacts/${{ matrix.lane }}.result.enc
          if-no-files-found: error
          retention-days: 2
