name: Clean Factory Bootstrap Render

on:
  push:
    branches:
      - clean-factory-bootstrap-20260922
    paths:
      - '.github/workflows/clean-factory-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: clean-factory-bootstrap-20260922
  cancel-in-progress: false

jobs:
  render-clean-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_URL: https://rhddgfvtrkmusbvphnlg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MEDIAFORGE_CORE_KEY_B64: ${{ secrets.MEDIAFORGE_CORE_KEY_B64 }}
      MEDIAFORGE_TTS_PROVIDER: chatterbox
      MEDIAFORGE_TTS_MAX_WORKERS: '1'
      MEDIAFORGE_TTS_STRICT_CHUNK_ORDER: '1'
    steps:
      - name: Checkout clean Leonidanos factory only
        uses: actions/checkout@v4
        with:
          repository: mediaforge-labs/leonidanos-factory
          ref: main
          path: clean-factory
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            clean-factory/public-worker-template/requirements.txt
            clean-factory/public-worker-template/requirements-production.txt

      - name: Verify inherited render secrets
        env:
          CORE_BUNDLE_B64: ${{ secrets.MEDIAFORGE_CORE_BUNDLE_B64 }}
          VOICE_REFERENCE_B64: ${{ secrets.MEDIAFORGE_VOICE_REFERENCE_B64 }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY missing'; exit 1; }
          test -n "$CORE_BUNDLE_B64" || { echo 'MEDIAFORGE_CORE_BUNDLE_B64 missing'; exit 1; }
          test -n "$MEDIAFORGE_CORE_KEY_B64" || { echo 'MEDIAFORGE_CORE_KEY_B64 missing'; exit 1; }
          test -n "$VOICE_REFERENCE_B64" || { echo 'MEDIAFORGE_VOICE_REFERENCE_B64 missing'; exit 1; }

      - name: Compile clean factory code
        working-directory: clean-factory
        run: |
          set -euo pipefail
          python -m py_compile \
            public-worker-template/worker.py \
            public-worker-template/supabase_chunked.py \
            public-worker-template/factory_worker.py

      - name: Install clean production dependencies
        working-directory: clean-factory
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          pip install -r public-worker-template/requirements.txt
          pip install -r public-worker-template/requirements-production.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Materialize clean encrypted core and voice reference
        working-directory: clean-factory
        env:
          CORE_BUNDLE_B64: ${{ secrets.MEDIAFORGE_CORE_BUNDLE_B64 }}
          VOICE_REFERENCE_B64: ${{ secrets.MEDIAFORGE_VOICE_REFERENCE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p .runtime
          printf '%s' "$CORE_BUNDLE_B64" | base64 --decode > .runtime/core.bundle.enc
          test -s .runtime/core.bundle.enc
          printf '%s' "$VOICE_REFERENCE_B64" | base64 --decode > .runtime/voice-reference.ogg
          ffmpeg -y -loglevel error -i .runtime/voice-reference.ogg -vn -ac 1 -ar 24000 -c:a pcm_s16le .runtime/voice-reference.wav
          test -s .runtime/voice-reference.wav
          echo "MEDIAFORGE_BUNDLE_PATH=$(realpath .runtime/core.bundle.enc)" >> "$GITHUB_ENV"
          echo "MEDIAFORGE_VOICE_REFERENCE_PATH=$(realpath .runtime/voice-reference.wav)" >> "$GITHUB_ENV"

      - name: Render isolated PT-BR job with music disabled
        working-directory: clean-factory
        run: |
          set -euo pipefail
          python public-worker-template/factory_worker.py \
            --lane pt-clean-bootstrap \
            --locale pt-BR \
            --bundle "$MEDIAFORGE_BUNDLE_PATH" \
            --worker public-worker-template/worker.py \
            --output-dir out/pt-clean-bootstrap

      - name: Render isolated EN-US job with music disabled
        working-directory: clean-factory
        run: |
          set -euo pipefail
          python public-worker-template/factory_worker.py \
            --lane en-clean-bootstrap \
            --locale en-US \
            --bundle "$MEDIAFORGE_BUNDLE_PATH" \
            --worker public-worker-template/worker.py \
            --output-dir out/en-clean-bootstrap
