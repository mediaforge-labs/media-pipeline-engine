name: TEMP - Leonidanos Upload Secret Check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-leonidanos-upload-secret-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OLD_SUPABASE_SECRET: ${{ secrets.OLD_SUPABASE_SECRET }}
      YOUTUBE_PT_CLIENT_ID: ${{ secrets.YOUTUBE_PT_CLIENT_ID }}
      YOUTUBE_PT_CLIENT_SECRET: ${{ secrets.YOUTUBE_PT_CLIENT_SECRET }}
      YOUTUBE_PT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_PT_REFRESH_TOKEN }}
      YOUTUBE_PT_CHANNEL_ID: ${{ secrets.YOUTUBE_PT_CHANNEL_ID }}
      YOUTUBE_EN_CLIENT_ID: ${{ secrets.YOUTUBE_EN_CLIENT_ID }}
      YOUTUBE_EN_CLIENT_SECRET: ${{ secrets.YOUTUBE_EN_CLIENT_SECRET }}
      YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
      YOUTUBE_EN_CHANNEL_ID: ${{ secrets.YOUTUBE_EN_CHANNEL_ID }}
    steps:
      - name: Check required upload secrets without exposing values
        shell: bash
        run: |
          python - <<'PY'
          import os
          names = [
            'SUPABASE_SECRET_KEY','SUPABASE_SERVICE_ROLE_KEY','OLD_SUPABASE_SECRET',
            'YOUTUBE_PT_CLIENT_ID','YOUTUBE_PT_CLIENT_SECRET','YOUTUBE_PT_REFRESH_TOKEN','YOUTUBE_PT_CHANNEL_ID',
            'YOUTUBE_EN_CLIENT_ID','YOUTUBE_EN_CLIENT_SECRET','YOUTUBE_EN_REFRESH_TOKEN','YOUTUBE_EN_CHANNEL_ID'
          ]
          for name in names:
            v=os.environ.get(name,'')
            print(f'{name}=' + ('present' if v else 'missing'))
          PY
